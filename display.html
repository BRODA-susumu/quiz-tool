<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>クイズ回答表示(記述式) - OBS用</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700;900&family=Noto+Serif+JP:wght@700;900&family=M+PLUS+Rounded+1c:wght@700;800&family=Reggae+One&family=Dela+Gothic+One&family=Yusei+Magic&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  [hidden]{display:none!important;}
  html,body{margin:0; padding:0; background:transparent; overflow:hidden;}
  body{font-family:"Noto Sans JP",-apple-system,BlinkMacSystemFont,sans-serif;}

  #stage{position:absolute; top:0; left:0; width:1920px; height:1080px; transform-origin:top left;}

  #qbar{
    position:absolute; left:40px; right:40px; top:30px;
    background:#fff; border-radius:18px; box-shadow:0 8px 24px rgba(0,0,0,.35);
    display:flex; align-items:center; justify-content:center;
    padding:14px 40px; color:#0b2a5b; font-weight:900; text-align:center;
    white-space:pre-wrap; overflow-wrap:anywhere; word-break:break-word; line-height:1.2;
  }
  #qbig{
    position:absolute; left:120px; right:120px; top:50%; transform:translateY(-50%);
    background:#fff; border-radius:28px; box-shadow:0 14px 40px rgba(0,0,0,.4);
    padding:60px 70px; color:#0b2a5b; font-weight:900; text-align:center;
    white-space:pre-wrap; overflow-wrap:anywhere; word-break:break-word; line-height:1.3;
  }

  #grid{position:absolute; left:0; right:0; display:flex; flex-wrap:wrap; align-content:center; justify-content:center;}

  .card{
    position:relative;
    background:linear-gradient(160deg,#1e6ae8,#0b3fa0);
    border:8px solid #fff; border-radius:22px;
    box-shadow:0 12px 36px rgba(0,0,0,.5), inset 0 0 0 3px rgba(0,0,0,.18);
    overflow:hidden; opacity:0; transform:scale(.92);
    animation:pop .35s cubic-bezier(.2,1.4,.4,1) forwards;
  }
  .card.correct{ background:linear-gradient(160deg,#f0343e,#a80c1c); }
  @keyframes pop{ to{opacity:1; transform:scale(1);} }

  .answer{
    position:absolute; left:0; right:0; top:0;
    color:#fff; font-weight:900; line-height:1.25; text-align:center;
    white-space:pre; word-break:keep-all; text-shadow:0 4px 10px rgba(0,0,0,.4);
    display:flex; align-items:center; justify-content:center;
  }
  .answer > div{width:100%; padding:0 4%;}

  /* ポイント強制表示(中央) : 黄色プレート+黒文字, トップは赤 */
  .ptplate{
    display:inline-flex; align-items:baseline; gap:.06em;
    background:#ffe14d; color:#1a1a1a; border-radius:.28em; padding:.06em .35em;
    box-shadow:0 4px 12px rgba(0,0,0,.35); font-weight:900;
  }
  .ptplate.top{ color:#e0102a; }
  .ptplate .u{ font-size:.5em; font-weight:900; }

  .nameBar{
    position:absolute; left:0; right:0; bottom:0;
    display:flex; align-items:center; justify-content:center; gap:.5em;
    background:linear-gradient(180deg, rgba(0,0,0,0), rgba(0,0,0,.42));
    color:#fff; font-weight:900; text-shadow:0 2px 6px rgba(0,0,0,.5); letter-spacing:.05em;
  }
  /* 名前の横のptバッジ: 黄色背景+黒文字, トップは赤, ptは小さめ */
  .pts{
    display:inline-flex; align-items:baseline; gap:.04em;
    background:#ffe14d; color:#1a1a1a; border-radius:.5em; padding:.08em .4em; font-weight:900;
  }
  .pts.top{ color:#e0102a; }
  .pts .u{ font-size:.62em; }

  /* 最終結果 */
  #results{
    position:absolute; inset:0; padding:26px 80px;
    display:flex; flex-direction:column; align-items:center;
  }
  #results h2{
    color:#fff; font-weight:900; font-size:52px; margin:2px 0 16px;
    text-shadow:0 4px 14px rgba(0,0,0,.5); letter-spacing:.08em;
  }
  #rlist{width:100%; max-width:1400px; display:flex; flex-direction:column; gap:10px;}
  .rrow{
    display:grid; grid-template-columns:120px 1fr auto; align-items:center; gap:24px;
    background:rgba(255,255,255,.96); border-radius:14px; padding:9px 30px;
    box-shadow:0 6px 18px rgba(0,0,0,.32);
  }
  .rrow .rank{font-weight:900; font-size:36px; color:#0b2a5b; text-align:center;}
  .rrow.top1 .rank{color:#e0102a;}
  .rrow .rname{font-weight:900; font-size:40px; color:#12203a; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .rrow .rpts{font-weight:900; font-size:40px; color:#1a1a1a;}
  .rrow.top1 .rpts{color:#e0102a;}
  .rrow .rpts .u{font-size:.55em;}
  #rpage{color:#fff; font-weight:900; font-size:24px; margin-top:14px; text-shadow:0 2px 8px rgba(0,0,0,.5);}

  #measure{position:absolute; visibility:hidden; pointer-events:none;
    font-weight:900; line-height:1.25; white-space:pre; word-break:keep-all; text-align:center;}
</style>
</head>
<body>
<div id="stage">
  <div id="qbar" hidden></div>
  <div id="qbig" hidden></div>
  <div id="grid"></div>
  <div id="results" hidden><h2>最終結果</h2><div id="rlist"></div><div id="rpage"></div></div>
</div>
<div id="measure"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = "https://ooukcrjaihuggeiajsqw.supabase.co";
const SUPABASE_KEY = "sb_publishable_Gd8q6yFNdS1CtUDQK5NH0Q_tZv6L2A6";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const FONTS = {
  gothic:  '"Noto Sans JP", sans-serif',
  mincho:  '"Noto Serif JP", serif',
  round:   '"M PLUS Rounded 1c", sans-serif',
  pop:     '"Reggae One", sans-serif',
  impact:  '"Dela Gothic One", sans-serif',
  hand:    '"Yusei Magic", sans-serif',
};

const STAGE_W = 1920, STAGE_H = 1080;
const stage = document.getElementById("stage");
const grid = document.getElementById("grid");
const measure = document.getElementById("measure");
const qbar = document.getElementById("qbar"), qbig = document.getElementById("qbig");
const resultsEl = document.getElementById("results"), rlist = document.getElementById("rlist"), rpage = document.getElementById("rpage");

function fitStage(){
  const s = Math.min(window.innerWidth / STAGE_W, window.innerHeight / STAGE_H);
  stage.style.transform = "scale(" + s + ")";
}
window.addEventListener("resize", () => { fitStage(); render(lastPayload); });
fitStage();

const MAX_CHARS = 9;
function wrap9(text){
  return String(text || "").split("\n").map(line => {
    const ch = Array.from(line);
    if (ch.length <= MAX_CHARS) return line;
    const out = [];
    for (let i = 0; i < ch.length; i += MAX_CHARS) out.push(ch.slice(i, i + MAX_CHARS).join(""));
    return out.join("\n");
  }).join("\n");
}

function fitInto(el, text, w, h, maxFs, pre){
  measure.style.fontFamily = stage.style.fontFamily || FONTS.gothic;
  measure.style.width = w + "px";
  measure.style.whiteSpace = pre ? "pre" : "pre-wrap";
  measure.style.wordBreak = pre ? "keep-all" : "break-word";
  let lo = 8, hi = Math.floor(maxFs);
  measure.textContent = text || " ";
  while (lo < hi){
    const mid = Math.ceil((lo + hi) / 2);
    measure.style.fontSize = mid + "px";
    if (measure.scrollHeight <= h && measure.scrollWidth <= w + 1) lo = mid; else hi = mid - 1;
  }
  el.style.fontSize = lo + "px";
  return lo;
}

let lastPayload = { items: [], showPoints: false, contentMode: "answer", question: "", font: "gothic", mode: "answers" };

function bestLayout(n, availW, availH){
  const GAP = 28;
  let best = { size: 0 };
  for (let cols = 1; cols <= n; cols++){
    const rows = Math.ceil(n / cols);
    const cw = (availW - GAP * (cols - 1)) / cols;
    const ch = (availH - GAP * (rows - 1)) / rows;
    const w = Math.min(cw, ch * 4 / 3);
    if (w > best.size) best = { size: w };
  }
  return { w: best.size, h: best.size * 3 / 4, gap: GAP };
}

function ptSpan(cls, points, isTop){
  const s = document.createElement("span");
  s.className = cls + (isTop ? " top" : "");
  s.textContent = (points ?? 0);
  const u = document.createElement("span"); u.className = "u"; u.textContent = "pt";
  s.appendChild(u);
  return s;
}

function render(payload){
  lastPayload = payload || {};
  const font = FONTS[lastPayload.font] || FONTS.gothic;
  stage.style.fontFamily = font;

  const mode = lastPayload.mode || "answers";
  grid.innerHTML = ""; qbar.hidden = true; qbig.hidden = true; resultsEl.hidden = true;

  if (mode === "results"){ renderResults(lastPayload); return; }

  const items = lastPayload.items || [];
  const showPoints = !!lastPayload.showPoints;
  const contentMode = lastPayload.contentMode || "answer";
  const question = (lastPayload.question || "").trim();
  const hasQ = question.length > 0, hasItems = items.length > 0;

  const maxPts = hasItems ? Math.max(...items.map(it => it.points || 0)) : 0;

  if (hasQ && !hasItems){
    qbig.hidden = false; qbig.textContent = question;
    fitInto(qbig, question, 1680 - 140, 700, 150, false);
  } else if (hasQ && hasItems){
    qbar.hidden = false; qbar.textContent = question;
    fitInto(qbar, question, 1840 - 80, 150, 76, false);
  }

  if (!hasItems) return;

  const PAD = 40;
  let top = PAD, availH;
  if (hasQ){ const barH = qbar.offsetHeight || 120; top = 30 + barH + 24; availH = STAGE_H - top - PAD; }
  else { top = PAD; availH = STAGE_H - PAD * 2; }
  const availW = STAGE_W - PAD * 2;
  grid.style.top = top + "px"; grid.style.height = availH + "px"; grid.style.alignContent = "center";

  const L = bestLayout(items.length, availW, availH);
  grid.style.gap = L.gap + "px";

  items.forEach((it, i) => {
    const card = document.createElement("div");
    card.className = "card" + (it.correct ? " correct" : "");
    card.style.width = L.w + "px"; card.style.height = L.h + "px";
    card.style.animationDelay = (i * 0.06) + "s";
    const nameH = Math.max(44, L.h * 0.16);
    const nameFs = Math.round(nameH * 0.42);
    const isTop = maxPts > 0 && (it.points || 0) === maxPts;

    const ans = document.createElement("div");
    ans.className = "answer";
    ans.style.bottom = nameH + "px";
    const inner = document.createElement("div");

    if (contentMode === "points"){
      const plate = ptSpan("ptplate", it.points || 0, isTop);
      inner.appendChild(plate);
      ans.appendChild(inner);
    } else {
      const wrapped = wrap9(it.answer);
      inner.textContent = wrapped;
      ans.appendChild(inner);
    }

    const bar = document.createElement("div");
    bar.className = "nameBar"; bar.style.height = nameH + "px"; bar.style.fontSize = nameFs + "px";
    if (showPoints && contentMode !== "points"){
      bar.appendChild(ptSpan("pts", it.points || 0, isTop));
    }
    const nm = document.createElement("span"); nm.textContent = it.name || "";
    bar.appendChild(nm);

    card.appendChild(ans); card.appendChild(bar);
    grid.appendChild(card);

    const aw = (L.w - 16 * 2) * 0.92, ah = (L.h - nameH) * 0.86;
    if (contentMode === "points"){
      // プレートの高さで文字サイズを調整
      inner.querySelector(".ptplate").style.fontSize = Math.min(ah * 0.8, aw * 0.5) + "px";
    } else {
      fitInto(inner, wrap9(it.answer), aw, ah, ah * 0.9, true);
    }
  });
}

function renderResults(p){
  resultsEl.hidden = false;
  const results = p.results || [];
  const per = 10;
  const page = p.resultsPage || 0;
  const start = page * per;
  const slice = results.slice(start, start + per);
  rlist.innerHTML = "";
  slice.forEach(r => {
    const row = document.createElement("div");
    row.className = "rrow" + (r.rank === 1 ? " top1" : "");
    const rk = document.createElement("div"); rk.className = "rank"; rk.textContent = r.rank + "位";
    const nm = document.createElement("div"); nm.className = "rname"; nm.textContent = r.name;
    const pt = document.createElement("div"); pt.className = "rpts";
    pt.textContent = (r.points ?? 0); const u = document.createElement("span"); u.className="u"; u.textContent="pt"; pt.appendChild(u);
    row.append(rk, nm, pt);
    rlist.appendChild(row);
  });
  const totalPages = Math.max(1, Math.ceil(results.length / per));
  rpage.textContent = results.length ? `${page + 1} / ${totalPages} ページ（${results.length}名）` : "参加者がいません";
}

window.renderPayload = render;

const params = new URLSearchParams(location.search);
const room = (params.get("room") || "").trim();

async function start(){
  if (!room){ render({ items: [], question: "URLに ?room=ルームコード を付けてください" }); return; }
  const { data } = await sb.from("quiz_display").select("payload").eq("room_code", room).maybeSingle();
  if (data && data.payload) render(data.payload);
  sb.channel("display-" + room)
    .on("postgres_changes",
      { event: "*", schema: "public", table: "quiz_display", filter: "room_code=eq." + room },
      p => { if (p.new && p.new.payload) render(p.new.payload); })
    .subscribe();
  setInterval(async () => {
    const { data } = await sb.from("quiz_display").select("payload").eq("room_code", room).maybeSingle();
    if (data && data.payload && JSON.stringify(data.payload) !== JSON.stringify(lastPayload)) render(data.payload);
  }, 15000);
}
start();
</script>
</body>
</html>
